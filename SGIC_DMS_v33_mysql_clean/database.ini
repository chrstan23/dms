; SGIC DMS - database settings
; ---------------------------------------------------------------------------------------------------
; engine = sqlite      the default: everything in the single file sgic_dms.db (nothing to install)
; engine = sqlserver   Microsoft SQL Server / SQL Server Express
; engine = mysql       MySQL / compatible MariaDB (requires MySQL Server and PyMySQL)
; Read SQLSERVER_SETUP.txt before switching. Restart the server after changing this file.
; ---------------------------------------------------------------------------------------------------
[database]
engine = mysql

; ---- only used when engine = sqlserver ----
server = localhost
database = SGIC_DMS
authentication = sql
username = sgic_app
password =
trust_server_certificate = yes

; ---- MySQL settings (used only when engine = mysql) ----
host = localhost
port = 3306
mysql_user = root
mysql_password = root
charset = utf8